name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    # Binary-asset releases like dawn-* must not publish npm.
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Resolved first, before anything expensive: a forgotten "Set as a pre-release" checkbox
      # then fails in seconds instead of after a full install, build and test run.
      #
      # Prereleases go to the `next` dist-tag so `npm install vgpu` keeps resolving to the last
      # stable. The guard covers the one mistake the UI makes easy: cutting `v0.2.0-rc.0` without
      # ticking the box would publish a release candidate straight to `latest`. A hyphen in the
      # tag is the signal, because semver only allows one there to introduce a prerelease.
      # (`dawn-*` / `lavapipe-*` tags also contain hyphens but never reach this job — the `if:`
      # above requires the tag to start with `v`.)
      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Prerelease $TAG_NAME -> publishing under dist-tag 'next'."
          elif [ "$TAG_NAME" != "${TAG_NAME#*-}" ]; then
            echo "::error::Release $TAG_NAME looks like a prerelease tag but the release is not marked as a pre-release; publishing it would move the 'latest' dist-tag. Edit the release, tick 'Set as a pre-release', and publish it again."
            exit 1
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable $TAG_NAME -> publishing under dist-tag 'latest'."
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # Release gates. These mirror ci.yml's `test-fast` job, which is the job that runs on a
      # plain runner with no Docker and no GPU. They run against the checked-out tag, so what
      # gets published is exactly what was verified.
      #
      # The previous gate was `pnpm test:fast`, which only covers adapter-mock, core, wgsl,
      # render and scripts — it never touched vgpu-api (the `vgpu` package itself), adapter-node
      # or the CLI, and it skipped typecheck and bundle budgets entirely.
      - name: Typecheck
        run: pnpm -w typecheck

      # The full suite, exactly as ci.yml runs it. Tests that need a real GPU (Dawn + Xvfb) are
      # guarded by `VGPU_DOCKER_TEST` and skip themselves here, so this stays runner-safe while
      # covering every publishable package. Real-device validation stays in ci.yml's `docker-gpu`
      # job on `main`; a release tag is only ever cut from an already-green `main`.
      - name: Run tests
        run: pnpm exec vitest run

      # Budgets are measured from `dist`, so this has to come after the build.
      - name: Check bundle budgets
        run: pnpm bundle-check

      - name: Upgrade npm for OIDC publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: pnpm -r publish --access public --no-git-checks --tag "$DIST_TAG"
