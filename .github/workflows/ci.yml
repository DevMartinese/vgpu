name: CI

on:
  push:
    branches: [main, feat/vgpu-rewrite]
  pull_request:

jobs:
  test-fast:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:filenames
      - run: pnpm -w typecheck
      - run: pnpm exec vitest run
      - run: pnpm bundle-check

  wgsl-loader-bundler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test packages/wgsl/tests/webpack-real.test.ts packages/wgsl/tests/vite-real.test.ts packages/wgsl/tests/runtime-cjs-require.test.ts

  docker-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck
      - name: Build Docker GPU image
        run: docker build -t vgpu-test-dev:ci -f infra/test-docker/Dockerfile.dev .
      - name: Run Dawn GPU validation in Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e VGPU_VALIDATE=require \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm exec vitest run packages/adapter-node/tests/buffer-readback.test.ts packages/wgsl/tests/reflection-gpu-layout.test.ts packages/wgsl/tests/representative-shaders.test.ts packages/wgsl/tests/validation-real-device.test.ts packages/wgsl/tests/validation.test.ts packages/vgpu-api/tests/gpu examples/fluid-validation/src/fluid-gpu.test.ts; \
              s=$?; kill $xp; exit $s'
      - name: Run pixel snapshot CLI in Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              node packages/vgpu/bin/vgpu.js snapshot --ci; \
              s=$?; kill $xp; exit $s'
      - name: Render docs example proofs in Docker
        run: |
          rm -rf artifacts/example-renders
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs render:proof; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs example render proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-example-renders
          path: artifacts/example-renders/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Compare docs example thumbnails in Docker
        run: |
          rm -rf artifacts/thumb-diffs
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs thumbs:check -- --artifact-dir ../../artifacts/thumb-diffs; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs thumbnail comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-thumb-comparison
          path: artifacts/thumb-diffs
          if-no-files-found: error
          retention-days: 7
      # --- TGEIST-14 anchor (gate G6): same two GPU steps, pointed at apps/docs-next ---
      # Form (b) of the ticket: the docs steps above are left untouched (no regression for the
      # old app) and the new app gets its own pair of steps in the SAME job, so the expensive
      # parts (docker build, pnpm install, typecheck) are paid once, not twice (risk #7).
      # Both apps run scripts/render-example-thumbs.mjs (byte-identical file) against
      # byte-identical public/examples baselines, so any pixel delta between the two blocks is a
      # real finding about the new tree (React 19 / Tailwind 4 / new deps), not about the harness.
      # Output dirs are suffixed -docs-next so the docs artifacts uploaded above are never clobbered.
      # This whole block collapses back into the docs steps at cutover (TGEIST-15), when
      # apps/docs-next becomes apps/docs and the docs-next filter disappears.
      - name: Render docs-next example proofs in Docker (TGEIST-14)
        run: |
          rm -rf artifacts/example-renders-docs-next
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs-next render:proof -- --proof-dir ../../artifacts/example-renders-docs-next; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs-next example render proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-next-example-renders
          path: artifacts/example-renders-docs-next/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Compare docs-next example thumbnails in Docker (TGEIST-14)
        run: |
          rm -rf artifacts/thumb-diffs-docs-next
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs-next thumbs:check -- --artifact-dir ../../artifacts/thumb-diffs-docs-next; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs-next thumbnail comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-next-thumb-comparison
          path: artifacts/thumb-diffs-docs-next
          if-no-files-found: error
          retention-days: 7

  wgsl-cachekey-determinism:
    name: wgsl-cachekey-determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test packages/wgsl/tests/cache-key.test.ts

  wgsl-turbopack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vgpu/wgsl build
      - name: next build (turbopack)
        run: pnpm --filter @vgpu/example-next-wgsl exec next build --turbopack
      - name: assert WGSL content in Turbopack output
        run: |
          grep -Rn "helper_color" examples/next-wgsl/.next/server examples/next-wgsl/.next/static > /tmp/wgsl-build-helper-matches.txt
          head -20 /tmp/wgsl-build-helper-matches.txt
          grep -Rn "0.1, 0.2, 0.3" examples/next-wgsl/.next/server examples/next-wgsl/.next/static > /tmp/wgsl-build-color-matches.txt
          head -20 /tmp/wgsl-build-color-matches.txt
      - name: next dev HMR smoke (turbopack)
        run: |
          set -euo pipefail
          HELPER=examples/next-wgsl/app/helper.wgsl
          ORIGINAL=$(cat "$HELPER")
          cleanup() {
            printf '%s\n' "$ORIGINAL" > "$HELPER"
            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          pnpm --filter @vgpu/example-next-wgsl exec next dev --turbopack -p 3100 > /tmp/next-wgsl-dev.log 2>&1 &
          SERVER_PID=$!
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3100/ > /tmp/wgsl-before.html; do sleep 1; done'
          grep -q "0.1, 0.2, 0.3" /tmp/wgsl-before.html
          cat > "$HELPER" <<'EOF'
          export fn helper_color() -> vec4f { return vec4f(0.9, 0.8, 0.7, 1.0); }
          EOF
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3100/ > /tmp/wgsl-after.html && grep -q "0.9, 0.8, 0.7" /tmp/wgsl-after.html; do sleep 1; done'
          grep -n "0.9, 0.8, 0.7" /tmp/wgsl-after.html | head -5
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/wgsl-after.html").read_text()
          idx = text.find("0.9, 0.8, 0.7")
          print(text[max(0, idx - 120):idx + 160] if idx >= 0 else text[:280])
          PY
          tail -30 /tmp/next-wgsl-dev.log


  docs-app-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm run build
      - name: Regenerate docs manifest + skill
        run: node packages/vgpu/lib/docs/generate/cli.js
      - name: Build docs app
        run: pnpm --filter docs build
      - name: Check docs example bundle isolation and budgets
        run: pnpm --filter docs check:example-bundles
      - name: Check the examples API artifact tree is bundled into its routes
        run: pnpm --filter docs check:examples-api-tracing

  # New job for the vgpu docs -> geistdocs migration (TGEIST-01). Builds the
  # new app scaffold at apps/docs-next, which lives alongside the untouched
  # apps/docs (job `docs-app-build` above) during the dual-run migration
  # window. Deliberately minimal for now (just `next build`): later tickets
  # extend this job with `check:examples-api-tracing` (TGEIST-06) and
  # `check:example-bundles` (TGEIST-08) once those exist in apps/docs-next.
  # Removed at cutover (TGEIST-15), when apps/docs-next is renamed to
  # apps/docs and `docs-app-build` covers the same app.
  docs-next-app-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs-next app
        run: pnpm --filter docs-next build
      # ANCHOR TGEIST-06 (examples API transplant). Completes G1 for the new app: the tracing check
      # asserts against .next/server/app of THIS build, so it has to run in the same job, right
      # after it. It is the only thing that can catch one of the three picomatch keys in
      # apps/docs-next/next.config.ts silently stopping to match its route.
      - name: Check the examples API artifact tree is bundled into its routes (docs-next)
        run: pnpm --filter docs-next check:examples-api-tracing
      # ANCHOR TGEIST-08 (previews verbatim + Grupo D re-baseline). This is the third and last
      # member of G1 for the new app ("build + check:examples-api-tracing + check:example-bundles",
      # Decision 1'). It grades the /preview/[slug] production chunks against the budgets
      # re-measured on this tree and asserts no example chunk carries another example's
      # renderer/WGSL. It must stay inside this job, right after the build: the script measures
      # .next/static/chunks and never builds (it hard-fails on chunks older than the sources rather
      # than grade a stale tree).
      - name: Check example bundle isolation and budgets (docs-next)
        run: pnpm --filter docs-next check:example-bundles
      # TGEIST-05 anchor — remark plugins M1-M9 + gate (c) of Decision 4.
      # `test:remark` unit-tests the mappings (including the adversarial case the
      # design names: a `*.docs.md` path inside a code-span that must NOT be
      # rewritten). `check:mdast-parity` is the render-parity gate: for every
      # page, the text of the mdast before the plugins must equal the text after
      # them, modulo whitespace — M1-M9 only change node types and attributes, so
      # any plugin that loses content fails here. It also asserts (a) every fence
      # language surviving the chain is one Shiki can load, which is what makes
      # the 19 ` ```terminal ` fences a build error rather than a surprise, and
      # (b) no `*.docs.md`/bare logical link survives unresolved (the 85 links
      # that would 404). Runs against the fixtures today and automatically
      # against `content/docs/**` once TGEIST-04 lands the real corpus.
      - name: Unit-test the docs-next remark plugins (M1-M9)
        run: pnpm --filter docs-next test:remark
      - name: Check mdast render parity (Decision 4c)
        run: pnpm --filter docs-next check:mdast-parity

  # ANCHOR TGEIST-06: G2 of Decision 1'. The examples API is transplanted into apps/docs-next
  # byte-for-byte, never rewritten, and this is what turns that promise into a machine invariant for
  # the whole dual-run window: it is the only defence against the two copies drifting apart while
  # separate tickets edit the tree over weeks. No allowlist, by design. Deleted at TGEIST-15/16,
  # when apps/docs stops existing and there is nothing left to compare against.
  check-examples-api-transplant:
    runs-on: ubuntu-24.04-arm
    steps:
      # No install and no build: the check only reads bytes off the checkout.
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the examples API transplant is byte-identical to apps/docs
        run: node apps/docs-next/scripts/check-examples-api-transplant.mjs

  docs-generated:
    # Guards that the committed docs manifest + generated skill (skills/vgpu, the payload
    # `npx skills add vercel-labs/vgpu` ships) are in sync with their sources (co-located
    # *.docs.md, docs/topics, docs/allowlist.txt, and the generator itself). The generator is
    # dependency-free (pure Node), so no install/build is needed. check-drift.js regenerates into a
    # scratch temp dir (it never mutates the working tree) and normalizes the SKILL.md stamp
    # (vgpuVersion/gitSha/generatedAt) before diffing, since that stamp is volatile by design.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skills/vgpu + docs manifest for drift
        run: node packages/vgpu/lib/docs/generate/check-drift.js
      - name: Check docs/nav.json coverage against the docs manifest
        run: node scripts/check-nav-coverage.mjs
      # TGEIST-04 anchor — geistdocs content target. Kept in this job (not a new one) because it has
      # the same inputs and the same zero-dependency pure-Node requirement as check-drift.js above.
      # Gate (b) of Decision 4: every page is its source minus frontmatter/H1/first paragraph, and
      # nothing else. The regenerate + `git diff --exit-code` pair is the drift half: the committed
      # apps/docs-next/content/docs tree cannot go stale. TGEIST-12 folds these steps into the
      # `docs-parity` job together with gates (a), (c) and (d).
      - name: Regenerate the geistdocs content tree
        run: node packages/vgpu/lib/docs/generate/generate-geistdocs.js
      - name: Check geistdocs content emission parity
        run: node packages/vgpu/lib/docs/generate/check-docs-content.mjs
      - name: Check the committed geistdocs content tree for drift
        run: git diff --exit-code -- apps/docs-next/content/docs

  examples-api-generated:
    # Frozen schemas, controlled vocabulary, and deterministic revision artifacts.
    runs-on: ubuntu-24.04-arm
    steps:
      # The artifact revision is a content hash of the source snapshot, so this job never reads
      # repository history: a shallow checkout is sufficient and merge strategy is irrelevant.
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate authored controlled vocabulary
        run: node apps/docs/scripts/validate-example-vocabulary.mjs
      - name: Synchronize frozen embedded schemas
        run: node apps/docs/scripts/sync-examples-api-contracts.mjs
      - name: Regenerate deterministic examples API artifacts
        run: node apps/docs/scripts/generate-examples-api.mjs
      # ANCHOR TGEIST-06: G3 of Decision 1'. Regenerating into the NEW tree as well is what actually
      # proves the claim the whole migration rests on -- that the artifact revision is a digest of
      # the source snapshot and of nothing else (not the app directory, not git history), so the
      # transplanted app serves the exact same URLs and bytes as the old one. Note the generator is
      # NOT edited: apps/docs-next/scripts/generate-examples-api.mjs is a byte-identical copy whose
      # hardcoded `apps/docs/...` source path is redirected purely by VGPU_EXAMPLES_OUTPUT_DIR, which
      # is why the old app can stay untouched for the whole window (G2 depends on that).
      # Removed at TGEIST-15, when there is only one tree again.
      - name: Regenerate deterministic examples API artifacts (docs-next tree)
        run: VGPU_EXAMPLES_OUTPUT_DIR=apps/docs-next/generated/examples-api node apps/docs-next/scripts/generate-examples-api.mjs
      - name: Fail if the two generated trees are not byte-identical
        run: diff -r apps/docs/generated/examples-api apps/docs-next/generated/examples-api
      - name: Test foundation contracts and publisher
        run: pnpm exec vitest run apps/docs/lib/examples-api apps/docs/scripts/validate-example-vocabulary.test.ts
      - name: Test foundation contracts and publisher (docs-next copy)
        run: pnpm exec vitest run apps/docs-next/lib/examples-api apps/docs-next/scripts/validate-example-vocabulary.test.ts
      - name: Fail on schema or artifact drift
        run: |
          changed=$(git status --porcelain -- apps/docs/generated/examples-api apps/docs/lib/examples-api/schemas packages/vgpu/lib/examples/schemas packages/vgpu/lib/examples/contracts.js apps/docs/lib/examples-api/contracts.generated.ts apps/docs-next/generated/examples-api)
          if [ -n "$changed" ]; then
            echo "::error::Examples API schemas or generated artifacts are out of date."
            echo "$changed"
            git diff -- apps/docs/generated/examples-api apps/docs/lib/examples-api/schemas packages/vgpu/lib/examples/schemas packages/vgpu/lib/examples/contracts.js apps/docs/lib/examples-api/contracts.generated.ts apps/docs-next/generated/examples-api
            exit 1
          fi
